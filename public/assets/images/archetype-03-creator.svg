      <stop offset="0%" stop-color="#BAC8B1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#BAC8B1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="320" height="320" rx="28" fill="#F4F6F2"/>
  <circle cx="160" cy="160" r="110" fill="url(#creatGlow)"/>
